packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

# One pinned version per dependency, shared by every workspace package.
catalog:
  "@types/node": 22.20.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 5.9.3
  vitest: 5.0.5
  zod: 3.25.76

# Packages whose install scripts are allowed to run (pnpm blocks others by default).
onlyBuiltDependencies:
  - esbuild
  - sharp
